<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Query 2</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background-color: rgb(252, 252, 242);
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        width: 95%;
        background-color: rgb(196, 3, 3);
        text-align: center;
        padding: 10px;
        border: 2px solid rgb(218, 32, 32);
      }
      .box {
        width: 40%;
        font-size: 30px;
        background-color: rgba(255, 106, 106, 0.571);
        display: inline-block;
        margin: 5px;
        border: 1px solid black;
        padding: 10px;
      }
      @media (max-width: 992px) {
        .box {
          width: 55%;
          font-size: 20px;
        }
      }
      @media (max-width: 762px) {
        .box {
          width: 93%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
      <div class="box">Box 5</div>
      <div class="box">Box 6</div>
    </div>
  </body>
</html>
