<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="profile.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
  </head>
  <body>
    <div class="profile-card">
      <img
        class="profile-img"
        src="img/Profile Image.jpg"
        alt="Image of John Smith"
      />

      <h2>John Smith</h2>
      <p class="bio">
        Web designer with a focus on clean design and responsive layouts.
      </p>
      <p><i class="bi bi-envelope-fill"></i>johnsmith@example.com</p>
      <p><i class="bi bi-phone-fill"></i>+91 99887 66554</p>
      <p><i class="bi bi-geo-alt-fill"></i>New Delhi, India</p>
    </div>
  </body>
</html>
