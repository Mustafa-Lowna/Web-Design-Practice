<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bootstrap Icons Demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      h1 {
        font-family: "Times New Roman", Times, serif;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .bi {
        color: rgb(221, 1, 1);
        font-size: 25px;
        margin-right: 15px;
      }
      .icon_row {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Bootstrap Icons Demo</h1>
    <div class="icon_row"><i class="bi bi-house-door"></i> Home</div>
    <div class="icon_row"><i class="bi bi-telephone"></i> Contact</div>
    <div class="icon_row"><i class="bi bi-envelope"></i> Email</div>
    <div class="icon_row"><i class="bi bi-gear"></i> Setting</div>
    <div class="icon_row"><i class="bi bi-person"></i> Profile</div>
    <div class="icon_row"><i class="bi bi-globe"></i> Website</div>
    <div class="icon_row"><i class="bi bi-geo-alt"></i>Address</div>
  </body>
</html>
