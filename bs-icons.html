<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bootstrap Icons Demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      h1 {
        font-family: "Times New Roman", Times, serif;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: rgb(216, 3, 3);
      }
      .bi {
        color: rgb(221, 1, 1);
        font-size: 25px;
        margin-right: 15px;
      }
      .icon_row {
        margin-bottom: 10px;
      }
      .greencolor {
        color: rgb(0, 197, 0);
      }
    </style>
  </head>
  <body>
    <h1>Bootstrap Icons Demo</h1>
    <div class="icon_row"><i class="bi bi-house-door"></i> Home</div>
    <div class="icon_row"><i class="bi bi-telephone"></i> Contact</div>
    <div class="icon_row"><i class="bi bi-envelope"></i> Email</div>
    <div class="icon_row"><i class="bi bi-gear"></i> Setting</div>
    <div class="icon_row"><i class="bi bi-globe"></i> Website</div>
    <div class="icon_row"><i class="bi bi-geo-alt"></i>Address</div>
    <div class="icon_row"><i class="bi bi-whatsapp"></i>WhatsApp</div>
    <div class="icon_row"><i class="bi bi-twitter"></i>Twitter</div>
    <div class="icon_row"><i class="bi bi-youtube"></i>YouTube</div>
    <div class="icon_row"><i class="bi bi-facebook"></i>Facebok</div>
    <div class="icon_row"><i class="bi bi-instagram"></i>Instagram</div>
    <div class="icon_row"><i class="bi bi-linkedin"></i>LinkedIn</div>
    <div class="icon_row"><i class="bi bi-pinterest"></i>Pinterest</div>
    <div class="icon_row"><i class="bi bi-snapchat"></i>Snapchat</div>
    <div class="icon_row"><i class="bi bi-tiktok"></i>Tik Tok</div>
    <div class="icon_row"><i class="bi bi-telegram"></i>Telegram</div>
  </body>
</html>
