<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Grid</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-4 bg-danger text-white p-4">Right</div>
        <div class="col-lg-4 bg-secondary text-white p-4">Centre</div>
        <div class="col-lg-4 bg-success text-white p-4">Left</div>
      </div>
      <div class="row mt-3">
        <div class="col-md-6 bg-danger text-white p-3">Right</div>
        <div class="col-md-6 bg-info text-white p-3">Centre</div>
      </div>
      <div class="row mt-3">
        <div class="col-sm-7 bg-warning text-white p-4">Right</div>
        <div class="col-sm-5 bg-secondary text-white p-4">Centre</div>
      </div>
    </div>
  </body>
</html>
