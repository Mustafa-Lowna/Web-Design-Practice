<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Units Demonstration</title>
    <style>
      :root {
        font-size: 20px;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
      }
      .px-box {
        width: 200px;
        height: 100px;
        background-color: rgb(12, 200, 37);
        margin-bottom: 15px;
      }
      .em-box {
        font-size: 1.5em;
        padding: 1em;
        background-color: rgb(0, 51, 255);
        width: 20em;
        margin-bottom: 15px;
      }
      .rem-box {
        font-size: 1.2rem;
        padding: 1rem;
        background-color: chocolate;
        width: 25rem;
        margin-bottom: 15px;
      }
      .percent-box {
        width: 50%;
        height: 50px;
        background-color: rgb(126, 92, 205);
        padding: 15px;
      }
      .container {
        width: 400px;
        border: 1px solid rgb(135, 133, 133);
        padding: 15px;
        background-color: #f0f0f0;
      }
      h2 {
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h2>CSS Units Demonstration</h2>
    <div class="px-box">Fixed Size Using <strong>px</strong> (200px Width)</div>
    <div class="em-box">
      Relative size using<strong>em</strong> (1.5em text,1em padding)
    </div>
    <div class="rem-box">
      Relative size using <strong>rem</strong> (1.2rem text,1rem padding)
    </div>
    <div class="container">
      <div class="percent-box">
        Width Set To <strong>80%</strong> Of Container (400px)
      </div>
    </div>
  </body>
</html>
